ENERGY_WINDOW_SENSOR_DEFINITIONS:

    # The window runs from the configured discharge floor up to the device's
    # charge_to_soc register, falling back to a full pack when that register
    # holds a value outside its own 13-100 range.
    usable_energy:
        key: usable_energy
        unit: kWh
        device_class: energy
        state_class: total
        precision: 2
        icon: "mdi:battery-arrow-down-outline"
        enabled_by_default: true
        mode: usable
        dependency_keys:
            soc: battery_soc
            capacity: battery_rated_capacity
    energy_to_full:
        key: energy_to_full
        unit: kWh
        device_class: energy
        state_class: total
        precision: 2
        icon: "mdi:battery-arrow-up-outline"
        enabled_by_default: true
        mode: to_full
        dependency_keys:
            soc: battery_soc
            capacity: battery_rated_capacity

# ---------------------------------------------------------------------------
# Registers that are never part of a block read.
#
# The coordinator bridges small gaps between wanted registers to save
# requests. A block that starts in, ends in or spans one of these ranges is
# never built: a definition inside one is read on its own, and only when its
# entity is enabled. This holds whether or not the DEV groups are loaded.
#
#   38000-39014  nothing is mapped here on the Venus E v3 (no sender), but the
#                read path of the control unit is the one of the Venus D, where
#                a read anywhere in the range makes it broadcast four CAN
#                frames per second until the next reboot
#   41500-41631  Wi-Fi SSID and password buffers of the communication module
#                (the password reads 0); the service set_wifi writes them,
#                nothing else touches them in a block
#   45000-45031  command registers (write-only); a read answers with an
#                exception for the whole block
#   45603-45605  each read waits up to 200 ticks for the inverter micro or the
#                Ethernet chip and blocks the Modbus task meanwhile
#   46000        switches RS485 to the shell / OTA mode
# ---------------------------------------------------------------------------
NO_BLOCK_READ_RANGES:
    - [38000, 39014]
    - [41500, 41631]
    - [45000, 45031]
    - [45603, 45605]
    - [46000, 46000]

# ---------------------------------------------------------------------------
# DEV_BUTTON_DEFINITIONS - only loaded with the option 'Show DEV registers'
#
# Commands from the firmware analysis that are real but change the state of
# the device. All are disabled by default and need a second press within the
# confirmation window (confirm: true); the first press only shows the warning.
# ---------------------------------------------------------------------------
DEV_BUTTON_DEFINITIONS:
    # Sets the inverter micro's sleep flag. Short-lived, as on the Venus D: the
    # output stops for about 0-5 s until the LED task clears the flag again
    # (unless the BMS itself requests sleep), and the micro writes its EEPROM.
    # No latch until a reboot (unlike the Venus A).
    dev_45002_inverter_sleep_request:
        register: 45002
        command: 1
        icon: "mdi:power-sleep"
        category: config
        enabled_by_default: false
        data_type: uint16
        confirm: true
    # Factory reset of the BMS: resets its protection parameter block and
    # restarts it (the battery is disconnected for about 1.5 s plus the boot
    # time). The SOC calibration data and the battery profile stay; the Venus
    # E v3 has no pack roles. Own warning text (confirm_key), because the
    # effect differs from the Venus D / A reset of every pack.
    dev_45028_bms_factory_reset:
        register: 45028
        command: 1
        icon: "mdi:battery-alert"
        category: config
        enabled_by_default: false
        data_type: uint16
        confirm: true
        confirm_key: dev_45028_bms_factory_reset_e3

# ---------------------------------------------------------------------------
# DEV_UNKNOWN_SENSOR_DEFINITIONS - option 'Show DEV registers'
#
# What is left after the firmware analysis of the Venus E v3: registers that
# only carry a value after a command (30211 after 45006, 30213 after 45001) or
# that are read on request only (45603 / 45604: a read blocks the Modbus task).
# Everything else was either promoted to a regular entity or is not offered.
#
# All of them are disabled by default: enabling the option creates the
# entities, enabling an entity starts reading it. Names follow
# 'DEV <register> (<meaning>)'.
# ---------------------------------------------------------------------------
DEV_UNKNOWN_SENSOR_DEFINITIONS:
  dev_30211:
    register: 30211
    name: "DEV 30211 (inverter hardware-fault input PB1, valid after 45006)"
    data_type: uint16
    category: diagnostic
    enabled_by_default: false
    scan_interval: low
    icon: mdi:flask-outline
  dev_30213:
    register: 30213
    name: "DEV 30213 (inverter EEPROM test acknowledgement, reads 1 after 45001)"
    data_type: uint16
    category: diagnostic
    enabled_by_default: false
    scan_interval: low
    icon: mdi:flask-outline
  dev_45603:
    register: 45603
    name: "DEV 45603 (inverter calibration value A, raw BCD)"
    data_type: uint16
    category: diagnostic
    enabled_by_default: false
    scan_interval: ultra
    isolated: true
    icon: mdi:flask-outline
  dev_45604:
    register: 45604
    name: "DEV 45604 (inverter calibration value B, raw BCD)"
    data_type: uint16
    category: diagnostic
    enabled_by_default: false
    scan_interval: ultra
    isolated: true
    icon: mdi:flask-outline

# ---------------------------------------------------------------------------
# DEV_DUPLICATE_SENSOR_DEFINITIONS - option 'Show DEV registers'
#
# Empty on the Venus E v3: the aliases of the firmware analysis (30107 / 30108,
# 30210, 32109-32111 follow-ons, 35111 / 35112, 37009-37011 and others) repeat a
# regular entity and are not offered.
# ---------------------------------------------------------------------------
DEV_DUPLICATE_SENSOR_DEFINITIONS: {}
