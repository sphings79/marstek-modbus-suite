# Venus E v3 register map.
#
# 3.1.0-beta.3: every register was checked against the Venus E v3 firmware
# (control 151, inverter micro 119, BMS 115). Wherever map and firmware
# disagreed, the firmware won; what changed is listed in the CHANGELOG. The map
# is not yet confirmed on every register by a hardware measurement; comments
# that claim a measurement name the model it was measured on.
#
# Differences to d.yaml:
#   - one fixed battery pack: the BMS 115 only ever sends pack 1 (16 cells),
#     the pack registers 34100-34699 always read 0 and 32109-32111 are the
#     constants 1 / 1 / 1. There are therefore no entities for packs 2-7, no
#     pack counter and no online mask.
#   - no MPPT / PV stage and no class-2 unit: nothing on the Venus E v3 sends
#     those frames, so the MPPT, PV and pack-coding registers are not mapped.
#   - 34002 (battery_soc) is the float SOC integrated from the inverter's
#     battery power, not the BMS display SOC of the Venus D; one decimal.
#   - the NTC channels of the inverter are swapped against the Venus D:
#     35000 is sensor CH12, 35001 sensor CH5.
#   - its own bit texts for the BMS protection and warning words 34007-34009
#     (the E3 BMS is a different code base from the D BMS).
#   - the inverter micro stores 3000 W as its factory limit, so the limit
#     read-back (44002 / 44003) can show more than the 2500 W the firmware
#     accepts as input.
#
# Words that are never read on their own: the Control's serializer hands out
# 32-bit words in pairs, so reading 36001 alone returns 36101, 36101 alone
# returns 36103 and 36103 alone returns the grid voltage. 36000 + 36001 are
# therefore one uint32 (alarm_status), and 36100, 36101 and 36103 sit next to
# each other so that they are read together in one block.

SENSOR_DEFINITIONS:
    device_model:
        # Fixed model string the control firmware rewrites at every boot
        # ("VNSE3-0"), not a name somebody gave the device. Called device_name
        # before 3.1.0-beta.3.
        register: 31000
        count: 10
        icon: "mdi:package-variant-closed"
        category: diagnostic
        enabled_by_default: true
        data_type: char
        scan_interval: ultra
    bms_version:
        register: 30204
        icon: "mdi:battery-check-outline"
        category: diagnostic
        enabled_by_default: true
        data_type: uint16
        scan_interval: ultra
        version_format: true
    vns_version:
        # Inverter (Micro) firmware. The firmware calls this part vns
        # (mod0=vns, vns_ver), like vns_boot_version below; "vms" was a typo.
        # Called vms_version before 3.1.0-beta.3.
        register: 30202
        icon: "mdi:battery-check-outline"
        category: diagnostic
        enabled_by_default: true
        data_type: uint16
        scan_interval: ultra
        version_format: true
    ems_version:
        register: 30200
        scale: 1
        icon: "mdi:ticket-confirmation-outline"
        category: diagnostic
        enabled_by_default: true
        data_type: uint16
        scan_interval: ultra
        version_format: true
    ems_boot_version:
        # Bootloader of the control unit. The bootloader is not part of the firmware
        # collection, so the value the device reports is not known in advance.
        register: 30201
        icon: "mdi:chip"
        category: diagnostic
        enabled_by_default: false
        data_type: uint16
        scan_interval: ultra
        version_format: true
    vns_boot_version:
        # Bootloader of the inverter micro. Set to 0 by the control unit while the link
        # to the inverter is down.
        register: 30203
        icon: "mdi:chip"
        category: diagnostic
        enabled_by_default: false
        data_type: uint16
        scan_interval: ultra
        version_format: true
    comm_module_firmware:
        register: 30350
        count: 6
        icon: "mdi:ticket-confirmation-outline"
        category: diagnostic
        enabled_by_default: true
        data_type: char
        scan_interval: low
    ble_mac_address:
        register: 30304
        count: 6
        icon: "mdi:bluetooth"
        category: diagnostic
        enabled_by_default: true
        data_type: mac
        scan_interval: ultra
    battery_soc:
        # The float SOC of the Venus E v3: it is integrated from the battery power the
        # inverter micro reports (fixed 100 Ah), it is not a coulomb counter of the BMS.
        # It is also reset to 100 % / 0 % when the BMS' own SOC reaches 100 % / 0, and
        # it can differ from the BMS SOC in between. The register has 0.1 % resolution,
        # hence one decimal. (The BMS' own SOC at 32104 / 37005 reads the same source
        # and is not offered.)
        register: 34002
        scale: 0.1
        unit: "%"
        device_class: battery
        state_class: measurement
        enabled_by_default: true
        data_type: uint16
        precision: 1
        scan_interval: high
    battery_rated_capacity:
        # Nominal capacity of the single pack: a constant 5120 (5.12 kWh) hard-coded in
        # the BMS 115 (the Venus D reports packs x 2560 Wh). Not the energy left in the
        # pack and independent of the state of charge. stored_energy and the energy
        # window sensors use it as the capacity. Called battery_total_energy before
        # 3.1.0-beta.3.
        register: 32105
        scale: 0.001
        unit: kWh
        device_class: energy_storage
        state_class: measurement
        enabled_by_default: true
        data_type: uint16
        precision: 3
        scan_interval: ultra
    battery_voltage:
        register: 30100
        scale: 0.01
        unit: V
        device_class: voltage
        state_class: measurement
        enabled_by_default: true
        data_type: uint16
        precision: 2
        scan_interval: high
    battery_current:
        register: 30101
        scale: 0.1
        unit: A
        device_class: current
        state_class: measurement
        enabled_by_default: true
        data_type: int16
        precision: 1
        scan_interval: high
    battery_power:
        register: 30001
        count: 1
        scale: 1
        unit: W
        device_class: power
        state_class: measurement
        enabled_by_default: true
        data_type: int16
        precision: 0
        scan_interval: high
    inverter_dc_voltage:
        # DC voltage at the inverter's battery side.
        register: 30000
        scale: 0.1
        unit: V
        device_class: voltage
        state_class: measurement
        category: diagnostic
        enabled_by_default: false
        data_type: uint16
        precision: 1
        scan_interval: low
    internal_temperature:
        # NTC channel CH12 of the inverter (also served at 30002). The two inverter NTCs
        # are swapped against the Venus D. The mounting places are not provable from the
        # code (the firmware only says "radiator 1 / 2"), so the name follows the
        # channel. The key stays, because it is the unique id of existing entities; the
        # displayed name comes from the translation_key.
        translation_key: inverter_temperature_ntc_ch12
        register: 35000
        scale: 0.1
        unit: °C
        device_class: temperature
        state_class: measurement
        enabled_by_default: true
        data_type: int16
        precision: 1
        scan_interval: low
    internal_mos1_temperature:
        # NTC channel CH5 of the inverter (also served at 30003). Not a MOSFET sensor:
        # the Venus E v3 has two NTCs and the code does not tie either to a MOSFET.
        # The key stays (unique id); the displayed name comes from the translation_key.
        translation_key: inverter_temperature_ntc_ch5
        register: 35001
        scale: 0.1
        unit: °C
        device_class: temperature
        state_class: measurement
        enabled_by_default: true
        data_type: int16
        precision: 1
        scan_interval: low
    ac_voltage:
        register: 32200
        scale: 0.1
        unit: V
        device_class: voltage
        state_class: measurement
        enabled_by_default: true
        data_type: uint16
        precision: 1
        scan_interval: high
    ac_power:
        register: 30006
        count: 1
        scale: 1
        unit: W
        device_class: power
        state_class: measurement
        enabled_by_default: true
        data_type: int16
        precision: 0
        scan_interval: high
    ac_frequency:
        register: 32204
        scale: 0.1
        unit: Hz
        device_class: frequency
        state_class: measurement
        enabled_by_default: true
        data_type: uint16
        precision: 1
