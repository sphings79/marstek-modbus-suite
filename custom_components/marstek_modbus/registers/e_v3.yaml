            - ac_power
            - battery_power
    set_discharge_power:
        register: 42021
        enabled_by_default: true
        icon: "mdi:battery-arrow-down-outline"
        min: 0
        max: 2500
        step: 50
        unit: W
        data_type: uint16
        scan_interval: high
        affects:
            - ac_power
            - battery_power
    # 0 would block charging or discharging in the inverter for good (it keeps
    # the value in its EEPROM and reloads it after every restart without a
    # range check), hence the minimum of 50. The maximum input is 2500 W, what
    # the firmware accepts. Unlike on the Venus D the register can be read back:
    # the control unit asks the micro for its real values, so a stored 0 would
    # show - but it would still be there after a restart. The micro's factory
    # state (after a factory reset) is 3000 W: that reading is shown as it is,
    # not clamped to 2500, although 3000 can no longer be written back.
    max_charge_power:
        register: 44002
        enabled_by_default: true
        icon: "mdi:battery-arrow-up-outline"
        min: 50
        max: 2500
        step: 50
        unit: W
        data_type: uint16
        scan_interval: ultra
        affects:
            - ac_power
            - battery_power
    max_discharge_power:
        register: 44003
        enabled_by_default: true
        icon: "mdi:battery-arrow-down-outline"
        min: 50
        max: 2500
        step: 50
        unit: W
        data_type: uint16
        scan_interval: ultra
        affects:
            - ac_power
            - battery_power
    # The firmware accepts 13-100 (10-12 return exception 3). It is a command:
    # a write starts a forced charge or discharge run towards this value, in
    # RS485 control mode with the inverter in work mode 0.
    charge_to_soc:
        register: 42011
        enabled_by_default: true
        icon: "mdi:battery-sync-outline"
        min: 13
        max: 100
