    battery_1_cell_16_voltage:
        register: 34033
        scale: 0.001
        unit: V
        device_class: voltage
        state_class: measurement
        enabled_by_default: false
        data_type: uint16
        precision: 3
        scan_interval: low
    # --- BMS pack 1 (the one fixed pack), new diagnostics. All disabled by default. ---
    bms_charge_current_limit:
        # Charge current limit of the BMS, used by the control unit for its power limit
        # (up to 100.0 A, depends on the battery profile and the temperature). 35111
        # serves the same value and is not offered.
        register: 32106
        scale: 0.1
        unit: A
        device_class: current
        state_class: measurement
        category: diagnostic
        enabled_by_default: false
        data_type: uint16
        precision: 1
        scan_interval: high
    bms_discharge_current_limit:
        # Discharge current limit of the BMS (same value at 35112, not offered).
        register: 32107
        scale: 0.1
        unit: A
        device_class: current
        state_class: measurement
        category: diagnostic
        enabled_by_default: false
        data_type: uint16
        precision: 1
        scan_interval: high
    battery_1_mos_status:
        # Which MOSFETs of the pack conduct: bit 0 = charge, bit 1 = discharge. The value
        # stays numeric (0 both off, 1 charge only, 2 discharge only, 3 both on); the
        # translations label the four states. 30210 serves the same value and is not
        # offered.
        register: 34004
        icon: "mdi:electric-switch"
        category: diagnostic
        enabled_by_default: false
        data_type: uint16
        scan_interval: high
    battery_1_protection_1:
        # BMS 115 protection word 1, a bit mask (never negative). The set bits are
        # decoded into the attributes active_bits / active_faults. The texts are those
        # of the Venus E v3 BMS, not the Venus D's: bit 9 is a short circuit there
        # (Venus D: relay or pre-charge fault) and the other thresholds differ. Bits 12
        # and up are not used by the firmware: they show as "unknown bit N". 37009
        # serves the same word and is not offered.
        register: 34007
        icon: "mdi:shield-alert-outline"
        category: diagnostic
        enabled_by_default: false
        data_type: uint16
        scan_interval: high
        bit_descriptions:
            0: Cell under-voltage (level 2)
            1: Cell over-voltage (level 2)
            2: Charge over-current (level 2)
            3: Discharge over-current (level 2)
            4: Charge under-temperature (level 2)
            5: Charge over-temperature (level 2)
            6: Discharge under-temperature (level 2)
            7: Discharge over-temperature (level 2)
            8: MOSFET over-temperature (level 2)
            9: Short circuit
            10: Charge MOSFET breakdown (current above 5 A with the MOSFET off)
            11: Discharge MOSFET breakdown (current above 5 A with the MOSFET off)
    battery_1_protection_2:
        # BMS 115 protection word 2, a bit mask. The Venus D texts do not apply: bits 14
        # and 15 mean something else here (Venus D: pack firmware mismatch, pack
        # offline). Bit 8 is never set by the firmware. 37010 serves the same word and
        # is not offered.
        register: 34008
        icon: "mdi:shield-alert-outline"
        category: diagnostic
        enabled_by_default: false
        data_type: uint16
        scan_interval: high
        bit_descriptions:
            9: NTC sensor fault (an NTC or the MOSFET NTC outside its valid range)
            12: Ambient NTC over-temperature (level 2)
            14: Cell break (a cell below 1500 mV while the pack is above 35.00 V)
            15: Cell voltage spread above 1000 mV
    battery_1_bms_warnings:
        # BMS 115 warning word: the level-1 warnings before a protection, decoded into
        # the attributes active_bits / active_faults. Bit 0 is never set. Bits above 12
        # are not used by the firmware. 37011 serves the same word and is not offered.
        register: 34009
        icon: "mdi:alert-outline"
        category: diagnostic
        enabled_by_default: false
        data_type: uint16
        scan_interval: high
        bit_descriptions:
            1: Cell under-voltage warning (below 2700 mV, 2400 mV when cold)
            2: Cell over-voltage warning (above 3600 mV)
            3: Charge over-current warning (55 A)
            4: Discharge over-current warning (55 A)
            5: Charge under-temperature (level 1)
            6: Charge over-temperature (level 1)
            7: Discharge under-temperature (level 1)
            8: Discharge over-temperature (level 1)
            9: MOSFET temperature high (level 1)
            11: Cell voltage spread above 1000 mV
            12: Ambient NTC under-temperature (level 1)
    battery_1_env_temperature:
        # Signed: a reading below 0 degC would otherwise show about 6553 degC.
        # 30107 / 30108 serve the same values and are not offered.
        register: 34011
        scale: 0.1
        unit: "°C"
        device_class: temperature
        state_class: measurement
        enabled_by_default: false
        data_type: int16
        precision: 1
        scan_interval: low
    battery_1_mos_temperature:
        register: 34012
        scale: 0.1
        unit: "°C"
        device_class: temperature
        state_class: measurement
        enabled_by_default: false
        data_type: int16
        precision: 1
        scan_interval: low
    battery_1_cell_temperature_1:
        # Four thermistors for sixteen cells, no mapping of NTC to cell.
        register: 34013
        scale: 0.1
        unit: "°C"
        device_class: temperature
        state_class: measurement
        enabled_by_default: false
        data_type: int16
        precision: 1
        scan_interval: low
    battery_1_cell_temperature_2:
        register: 34014
        scale: 0.1
        unit: "°C"
        device_class: temperature
        state_class: measurement
        enabled_by_default: false
        data_type: int16
        precision: 1
        scan_interval: low
    battery_1_cell_temperature_3:
        register: 34015
        scale: 0.1
        unit: "°C"
        device_class: temperature
        state_class: measurement
        enabled_by_default: false
        data_type: int16
        precision: 1
        scan_interval: low
    battery_1_cell_temperature_4:
        register: 34016
        scale: 0.1
        unit: "°C"
        device_class: temperature
        state_class: measurement
        enabled_by_default: false
        data_type: int16
        precision: 1
        scan_interval: low
    battery_1_profile:
        # Active battery profile of the BMS (0 to 5): the low byte of 34017, the
        # read-back of command 45011. Read-only: the profile select 45011 is not offered
        # (see docs/not-offered-registers.md). The high byte of 34017 (the MOSFET-off
        # bits, the inverse of 34004) is deliberately not decoded.
        register: 34017
        icon: "mdi:battery-heart-variant"
        category: diagnostic
        enabled_by_default: false
        data_type: uint8_low
        scan_interval: ultra
    selftest_status:
        # Self-test after power-on. The value 4 is never written.
        # 5 on its own is harmless: on two real Venus D with a working LAN the
        # Ethernet chip reports 0x4A where the self-test expects 0x4B. Only 2
        # (EEPROM) and 3 (flash) are real faults.
        register: 30212
        icon: "mdi:clipboard-check-outline"
        category: diagnostic
        enabled_by_default: false
        data_type: uint16
        scan_interval: low
        states:
            0: Not run yet
            1: OK
            2: EEPROM fault
            3: Flash fault
            5: Ethernet chip reports another version than expected (harmless)
    bms_charge_voltage_limit:
        # Charge voltage limit of the BMS: a constant 57.6 V, informational only on the
        # Venus E v3 (the grid feed-in limiter that uses it on the Venus D is compiled
        # out).
        register: 35110
        scale: 0.1
        unit: V
        device_class: voltage
        state_class: measurement
        category: diagnostic
        enabled_by_default: false
        data_type: uint16
        precision: 1
        scan_interval: low
    ethernet_chip_version:
        # Direct SPI read of the Ethernet chip (0 while the link is down). Never part
        # of a block (isolated and NO_BLOCK_READ_RANGES): a read blocks the Modbus task
        # for a moment.
        register: 45605
        icon: "mdi:ethernet"
        category: diagnostic
        enabled_by_default: false
        data_type: uint16
        scan_interval: ultra
        isolated: true
    inverter_state:
        # Same field as on the Venus D, with the decision rules of the Venus E v3:
        # 2 (charge) also when the BMS reports a charge current above 0.4 A; 4 and 6
        # are the idle states in backup / parallel mode (6 when the control state is
        # 0xCC). 0 means standby, inverter disabled or no data.
        register: 35100
        scale: 1
        icon: "mdi:state-machine"
        enabled_by_default: true
        data_type: uint16
        scan_interval: high
        states:
            0: "Standby / disabled (or no data)"
            1: Idle
            2: Charge
            3: Discharge
            4: "Idle in backup / parallel mode"
            5: Firmware update
            6: "Idle in backup / parallel mode (passthrough)"
    modbus_address:
        register: 41100
        icon: "mdi:home-automation"
        enabled_by_default: true
        data_type: uint16
        scan_interval: low
    ac_offgrid_voltage:
        register: 32300
        scale: 0.1
        unit: V
        device_class: voltage
        state_class: measurement
        enabled_by_default: false
        data_type: uint16
        precision: 1
        scan_interval: low
    ac_offgrid_power:
        register: 32302
        count: 1
        scale: 1
        unit: W
        device_class: power
        state_class: measurement
        enabled_by_default: false
        data_type: int16
        precision: 0
        scan_interval: high
    device_ip:
        # Filled only after an Ethernet DHCP lease: without a fitted or connected RJ45
        # port it reads 0.0.0.0. LAN only; the Wi-Fi address is not offered.
        register: 30400
        count: 2
        icon: "mdi:ip-network"
        category: diagnostic
        enabled_by_default: false
        data_type: ipv4
        scan_interval: low
    gateway_ip:
        register: 30402
        count: 2
        icon: "mdi:ip-network-outline"
        category: diagnostic
        enabled_by_default: false
        data_type: ipv4
        scan_interval: low
    wifi_signal_strength:
        register: 30303
        scale: -1
        unit: dBm
        device_class: signal_strength
        icon: "mdi:wifi"
        category: diagnostic
        enabled_by_default: false
        data_type: uint16
        precision: 0
        scan_interval: low
    bluetooth_status:
        # Bluetooth (BLE) connection state of the communication module.
        register: 30301
        icon: "mdi:bluetooth"
        category: diagnostic
        enabled_by_default: true
        data_type: uint16
        scan_interval: low
        states:
            0: "Off / not initialised"
            1: Advertising
            2: Connected
            3: Disconnected
            4: Not advertising
    # --- Fault and alarm words ---
    # The Venus E v3 serves the same 32-bit words as the Venus D, at the same
    # register numbers (the descriptor table unpacked from the E3 control
    # firmware matches the D table entry for entry), high word first:
    # error_code1 = 36100 << 16 | 36101, error_code2 = 36102 << 16 | 36103.
    #
    # Read these only as pairs or in one block, never a word on its own: see
    # the note at the top of the file.
    alarm_status:
        # 36000 + 36001 as one uint32 (count 2). The only alarm bit the Venus E v3 sets
        # is bit 0, in the low word at 36001; the high word at 36000 alone always reads
        # 0, so there is no separate entity for either half. Called alarm_status (36000
        # only) and alarm_status_low (36001 only) before 3.1.0-beta.3. The set bit is
        # decoded by alarm_status_low_description.
        register: 36000
        count: 2
        icon: "mdi:alert"
        category: diagnostic
        enabled_by_default: true
        data_type: uint32
        scan_interval: high
    fault_status:
        # High word of error_code1, so bit N here is overall bit 16+N.
        register: 36100
        icon: "mdi:alert"
        category: diagnostic
        enabled_by_default: true
        data_type: uint16
        scan_interval: high
    fault_status_low:
        # Low word of error_code1, so bit N here is overall bit N. Never read on its
        # own (a read of 36101 alone returns 36103).
        register: 36101
        icon: "mdi:alert"
        category: diagnostic
        enabled_by_default: true
        data_type: uint16
        scan_interval: high
    fault_status_2_low:
        # Low word of error_code2, so bit N here is overall bit N. The high word
        # (36102) is never written (its only setter, the self-test bit, cannot fire)
        # and is no longer read. Never read on its own (a read of 36103 alone returns
        # the grid voltage).
        register: 36103
        icon: "mdi:alert"
        category: diagnostic
        enabled_by_default: true
        data_type: uint16
        scan_interval: high

