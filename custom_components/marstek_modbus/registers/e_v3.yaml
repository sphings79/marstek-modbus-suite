        category: diagnostic
        enabled_by_default: true
        scan_interval: low
    # --- Fault and alarm words ---
    # The Venus E3 serves the same three 32-bit words as the Venus D, at the
    # same register numbers: the descriptor table unpacked from the E3 control
    # firmware carries 36000, 36100 and 36102 (aliases 37013/37015) and matches
    # the D table entry for entry - 246 registers, no difference in type, scale,
    # element size or count, only shifted SRAM pointers. They were simply never
    # mapped here.
    #
    # The word order is the D's as well, high word first:
    # error_code1 = 36100 << 16 | 36101, error_code2 = 36102 << 16 | 36103.
    alarm_status:
        register: 36000
        data_type: uint16
        device_class: problem
        icon: "mdi:alert"
        category: diagnostic
        enabled_by_default: true
        scan_interval: high
        # High word of the alarm mask. No setter exists above bit 0, so this
        # register is expected to stay at 0.
    alarm_status_low:
        register: 36001
        data_type: uint16
        icon: "mdi:alert"
        category: diagnostic
        enabled_by_default: true
        scan_interval: high
        # Low word, bit N here is overall bit N. Unlike the Venus D, whose
        # inverter firmware never writes the alarm word at all, the E3 sets and
        # clears bit 0.
    fault_status:
        register: 36100
        data_type: uint16
        icon: "mdi:alert"
        category: diagnostic
        enabled_by_default: true
        scan_interval: high
        # High word of error_code1, so bit N here is overall bit 16+N.
    fault_status_low:
        register: 36101
        data_type: uint16
        icon: "mdi:alert"
        category: diagnostic
        enabled_by_default: true
        scan_interval: high
        # Low word of error_code1, so bit N here is overall bit N.
    fault_status_2:
        register: 36102
        data_type: uint16
        icon: "mdi:alert"
        category: diagnostic
        enabled_by_default: true
        scan_interval: high
        # High word of error_code2, so bit N here is overall bit 16+N.
    fault_status_2_low:
        register: 36103
        data_type: uint16
        icon: "mdi:alert"
        category: diagnostic
        enabled_by_default: true
        scan_interval: high
        # Low word of error_code2, so bit N here is overall bit N.

