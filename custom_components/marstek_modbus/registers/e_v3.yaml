    factory_reset:
        register: 41001
        command: 21930
        icon: "mdi:factory"
        category: diagnostic
        enabled_by_default: false
        data_type: uint16

BITFIELD_TEXT_SENSOR_DEFINITIONS:
    # These texts come from the Venus D inverter firmware, and that transfer is
    # justified here: the E3 inverter image (inv_app_0119) is the same code base
    # as the D's (vd_inv_app_0116) - same reset handler 0x080042AD, 43% shared
    # code blocks, the error block reached the same way through a literal pool,
    # and bit for bit the same layout including the event codes that go with it
    # (0x36 for the hardware latches, 0x13 for bit 7, 0x31 for bit 8, 0x35 for
    # bit 11). The Venus A is a different code base and does not share any of
    # this - see a.yaml.
    #
    # Two differences to the D are already known and are reflected below:
    # the E3 writes alarm bit 0, which the D never touches, and the D notes are
    # missing err2 bit 8, which both images set.
    fault_status_description:
        key: fault_status_description
        icon: "mdi:alert-circle-outline"
        category: diagnostic
        enabled_by_default: true
        dependency_keys:
            source: fault_status
        # Bit N is overall bit 16+N. Both were confirmed on Venus D hardware:
        # pulling the battery raises overall bit 20, and a pack running a
        # mismatched firmware raised overall bit 21.
        bit_descriptions:
            4: BMS offline / battery disconnected
            5: BMS reports a fault (check pack firmware versions)
    fault_status_low_description:
        key: fault_status_low_description
        icon: "mdi:alert-circle-outline"
        category: diagnostic
        enabled_by_default: true
        dependency_keys:
            source: fault_status_low
        # Carried over from the Venus D, where bit 7 is confirmed across several
        # hardware logs. Bits 6 and 9 were only ever seen together during DC
        # discharge and are not established. None of the three has been seen on
        # an E3 yet.
        bit_descriptions:
            6: Seen during DC discharge (unconfirmed)
            7: Backup / off-grid branch cannot operate (overload, too little energy, no battery)
            9: Seen during DC discharge (unconfirmed)
    fault_status_2_description:
        key: fault_status_2_description
        icon: "mdi:alert-circle-outline"
        category: diagnostic
        enabled_by_default: false
        dependency_keys:
            source: fault_status_2
        bit_descriptions:
            0: Self-test failed
    fault_status_2_low_description:
        key: fault_status_2_low_description
        icon: "mdi:alert-circle-outline"
        category: diagnostic
        enabled_by_default: false
        dependency_keys:
            source: fault_status_2_low
        # Bits 0, 1 and 3 latch individual hardware protections that the
        # firmware never names; bit 4 is set alongside any of them. Bit 8 is the
        # overload integrator: a counter that climbs while the current stays
        # above its threshold and only trips once it overflows, so it means the
        # limit was exceeded for a while rather than for an instant.
        bit_descriptions:
            0: Hardware protection latch B
            1: Hardware protection latch A
            3: Hardware protection latch C
            4: Hardware protection triggered
            7: Shut down by supervisor, retry after 60 s
            8: Operating limit exceeded for too long (overload integrator)
            9: Supervisor fault (low confidence)
            11: Limit exceeded for more than 3000 cycles
    alarm_status_low_description:
        key: alarm_status_low_description
        icon: "mdi:alert-outline"
        category: diagnostic
        enabled_by_default: false
        dependency_keys:
            source: alarm_status_low
        # The only alarm bit any of the analysed images writes. It is set while
        # an internal mode flag is clear and cleared again when it is set, and
        # each branch then works against a different limit table - so it marks
        # an operating mode rather than a fault. Not confirmed on hardware.
        bit_descriptions:
            0: Alternate limit set active (low confidence)

VERSION_SENSOR_DEFINITIONS:
    firmware_version:
        key: firmware_version
        unit: null
        icon: "mdi:chip"
        category: diagnostic
        enabled_by_default: true
        mode: ems_vms_bms
        dependency_keys:
            ems: ems_version
            vms: vms_version
            bms: bms_version

EFFICIENCY_SENSOR_DEFINITIONS:
    round_trip_efficiency_total:
        key: round_trip_efficiency_total
        unit: "%"
        icon: "mdi:percent"
        category: diagnostic
        state_class: measurement
        mode: round_trip
        dependency_keys:
            charge: total_charging_energy
            discharge: total_discharging_energy
    round_trip_efficiency_monthly:
        key: round_trip_efficiency_monthly
        unit: "%"
        icon: "mdi:percent"
        category: diagnostic
        state_class: measurement
        mode: round_trip
        dependency_keys:
            charge: total_monthly_charging_energy
            discharge: total_monthly_discharging_energy
    conversion_efficiency:
        key: conversion_efficiency
        unit: "%"
        category: diagnostic
        state_class: measurement
        mode: conversion
        dependency_keys:
            battery_power: battery_power
            ac_power: ac_power

STORED_ENERGY_SENSOR_DEFINITIONS:
    stored_energy:
        key: stored_energy
        unit: kWh
        device_class: energy
        state_class: total
        dependency_keys:
            soc: battery_soc
            capacity: battery_total_energy

CYCLE_SENSOR_DEFINITIONS:
    battery_cycle_count_calc:
        key: battery_cycle_count_calc
        icon: "mdi:counter"
        category: diagnostic
        state_class: measurement
        dependency_keys:
            discharge: total_discharging_energy
            capacity: battery_total_energy

RUNTIME_SENSOR_DEFINITIONS:

    runtime_to_empty:
        key: runtime_to_empty
        unit: h
        device_class: duration
        state_class: measurement
        precision: 2
        icon: "mdi:battery-clock-outline"
        enabled_by_default: true
        mode: to_empty
        dependency_keys:
            soc: battery_soc
            capacity: battery_total_energy
            power: battery_power
    runtime_to_full:
        key: runtime_to_full
        unit: h
        device_class: duration
        state_class: measurement
        precision: 2
        icon: "mdi:battery-clock"
        enabled_by_default: true
        mode: to_full
        dependency_keys:
            soc: battery_soc
            capacity: battery_total_energy
            power: battery_power

BATTERY_LIFE_SENSOR_DEFINITIONS:

    # rated_cycles is the manufacturer's cycle rating for the LFP cells. The
    # battery does not report it, so both sensors below are estimates. Correct
    # the figure here if a model turns out to be rated differently.
    remaining_cycles:
        key: remaining_cycles
        unit: cycles
        state_class: measurement
        icon: "mdi:battery-sync-outline"
        category: diagnostic
        enabled_by_default: true
        mode: remaining_cycles
        rated_cycles: 6000
        dependency_keys:
            discharge: total_discharging_energy
            capacity: battery_total_energy
    battery_health:
        key: battery_health
        unit: "%"
        state_class: measurement
        precision: 2
        icon: "mdi:heart-pulse"
        category: diagnostic
        enabled_by_default: true
        mode: health
        rated_cycles: 6000
        dependency_keys:
            discharge: total_discharging_energy
            capacity: battery_total_energy

ENERGY_WINDOW_SENSOR_DEFINITIONS:

    # The window runs from the configured discharge floor up to the device's
    # charge_to_soc register, falling back to a full pack when that register
    # holds a value outside its own 10-100 range.
    usable_energy:
        key: usable_energy
        unit: kWh
        device_class: energy
        state_class: total
        precision: 2
        icon: "mdi:battery-arrow-down-outline"
        enabled_by_default: true
        mode: usable
        dependency_keys:
            soc: battery_soc
            capacity: battery_total_energy
    energy_to_full:
        key: energy_to_full
        unit: kWh
        device_class: energy
        state_class: total
        precision: 2
        icon: "mdi:battery-arrow-up-outline"
        enabled_by_default: true
        mode: to_full
        dependency_keys:
            soc: battery_soc
            capacity: battery_total_energy

