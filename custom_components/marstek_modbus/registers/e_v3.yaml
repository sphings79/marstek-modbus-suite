BUTTON_DEFINITIONS:
    reset_device:
        register: 41000
        command: 21930
        icon: "mdi:restart"
        category: diagnostic
        enabled_by_default: true
        data_type: uint16
    # The real factory reset: 0xAA11 to 41000. What it resets on the Venus E v3:
    # the control unit to its factory settings (settings, schedules, limits,
    # energy statistics, cloud identity) and the TLS certificates of the Wi-Fi
    # module; the inverter micro to its factory defaults, which means limits of
    # 3000 / 3000 W and grid standard 0 (the grid standard can only be restored
    # through the micro's own RS485 or its shell); the BMS only its protection
    # parameter block (the battery profile stays). The device reboots. The
    # button used to write 0x55AA to 41001, which the Venus E v3 does not
    # implement. confirm: the first press only shows the warning (text
    # confirm_factory_reset_e3), a second press within the window runs it.
    factory_reset:
        register: 41000
        command: 43537
        icon: "mdi:factory"
        category: config
        enabled_by_default: false
        data_type: uint16
        confirm: true
        confirm_key: factory_reset_e3
    # Front panel LED lamp test; the value is the duration in ms (1-29999).
    # The Venus E v3 drives 28 LED segments.
    led_test:
        register: 45012
        command: 3000
        icon: "mdi:led-on"
        category: config
        enabled_by_default: false
        data_type: uint16
    # Asks the inverter for the level of its hardware-fault input PB1 (no side
    # effect). The answer lands in the DEV sensor 30211 (DEV registers).
    read_inverter_input_pb1:
        register: 45006
        command: 1
        icon: "mdi:chip"
        category: diagnostic
        enabled_by_default: false
        data_type: uint16
    # Runs the inverter micro's EEPROM write test (one EEPROM write per press).
    # The result is the DEV sensor 30213, which only reads a constant 1 after
    # the test.
    inverter_eeprom_test:
        register: 45001
        command: 1
        icon: "mdi:memory"
        category: diagnostic
        enabled_by_default: false
        data_type: uint16

BITFIELD_TEXT_SENSOR_DEFINITIONS:
    # These texts come from the Venus E v3 inverter firmware (inv_app 119),
    # which is the same code base as the Venus D's (vd_inv_app 116): same reset
    # handler, same error block, and the same event codes. The Venus A is a
    # different code base and does not share any of this - see a.yaml.
    fault_status_description:
        key: fault_status_description
        icon: "mdi:alert-circle-outline"
        category: diagnostic
        enabled_by_default: true
        dependency_keys:
            source: fault_status
        # Bit N is overall bit 16+N. Both were confirmed on Venus D hardware:
        # pulling the battery raises overall bit 20, and a pack running a
        # mismatched firmware raised overall bit 21. On the Venus E v3 bit 21
        # follows the protection words of its own BMS (battery_1_protection_1
        # / _2), there is no pack firmware to mismatch.
        bit_descriptions:
            4: BMS offline / battery disconnected
            5: BMS reports a fault (check pack firmware versions)
    fault_status_low_description:
        key: fault_status_low_description
        icon: "mdi:alert-circle-outline"
        category: diagnostic
        enabled_by_default: true
        dependency_keys:
            source: fault_status_low
        # Bits 0-4 come from the inverter's grid protection and compare against
        # the limits of the configured grid standard (those differ from the
        # Venus D's); bit 7 is confirmed across several hardware logs on the
        # Venus D. Bits 6 and 9 had no setter in the firmware and are gone.
        bit_descriptions:
            0: Grid over-voltage
            1: Grid under-voltage
            2: Grid over-frequency
            3: Grid under-frequency
            4: Grid voltage peak
            7: AC voltage waveform deviates from the grid sine (seen when the backup output fails)
    fault_status_2_low_description:
        key: fault_status_2_low_description
        icon: "mdi:alert-circle-outline"
        category: diagnostic
        enabled_by_default: false
        dependency_keys:
            source: fault_status_2_low
        # Bits 0, 1 and 3 latch individual hardware protections that the
        # firmware never names; bit 4 is set alongside any of them. Bit 8 is the
        # overload integrator: a counter that climbs while the current stays
        # above its threshold and only trips once it overflows, so it means the
        # limit was exceeded for a while rather than for an instant. Bit 5
        # needs three consecutive over-current samples on the Venus E v3.
        bit_descriptions:
            0: Hardware protection latch B
            1: Hardware protection latch A
            3: Hardware protection latch C
            4: Hardware protection triggered
            5: Software over-current (above 30 A, 3 consecutive samples)
            6: DC bus over-voltage (above 530 V)
            7: Shut down by supervisor, retry after 60 s
            8: Operating limit exceeded for too long (overload integrator)
            9: Supervisor fault (low confidence)
            11: Limit exceeded for more than 3000 cycles
    # The text sensor of alarm_status (the uint32 over 36000 + 36001). The key
    # keeps its old name so that the entity of existing installations stays.
    alarm_status_low_description:
        key: alarm_status_low_description
        icon: "mdi:alert-outline"
        category: diagnostic
        enabled_by_default: false
        dependency_keys:
            source: alarm_status
        # The only alarm bit the Venus E v3 inverter writes: set while the grid
        # release flag is missing and cleared again once it is set, so it
        # means the inverter is waiting for the grid release, not a fault. (On
        # the Venus D this word is never written.)
        bit_descriptions:
            0: Grid release missing / waiting for the grid

