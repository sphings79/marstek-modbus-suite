SELECT_DEFINITIONS:
    # Verified on Venus D firmware v150; the Venus E v3 control firmware 151 has
    # the same handler, so it holds here as well.
    # Shares its firmware byte with rs485_control_mode (42000) — see the note
    # there. Selecting any option here writes 0x01/0x00/0x05 and therefore ends
    # RS485 control; forced charge/discharge stops taking effect.
    # Option 2 is the firmware's AI mode (called trade_mode before
    # 3.1.0-beta.3). Reading back is ambiguous: AI, the automatic mode, the
    # passive mode and RS485 control all read 1 (anti_feed), so the select
    # can show anti_feed although AI was written.
    user_work_mode:
        register: 43000
        enabled_by_default: true
        scan_interval: high
        options:
            manual: 0
            anti_feed: 1
            ai: 2
    force_mode:
