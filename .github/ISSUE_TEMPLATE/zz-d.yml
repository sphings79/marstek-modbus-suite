name: ZZ D
description: bug form first half
body:
- type: markdown
  attributes:
    value: 'One behaviour per report, please. The version and connection details below are what

      make a report reproducible — a report without them usually ends in a round of questions.

      '
- type: checkboxes
  id: preflight
  attributes:
    label: Before reporting
    options:
    - label: I searched the existing issues and none of them match.
      required: true
    - label: I am running the latest released version of the integration.
      required: true
    - label: I read [Known issues](https://github.com/sphings79/marstek-modbus-suite#known-issues) and
        [FIRMWARE-DROPOUTS.md](https://github.com/sphings79/marstek-modbus-suite/blob/main/FIRMWARE-DROPOUTS.md),
        and this is not one of them.
      required: true
- type: textarea
  id: problem
  attributes:
    label: What happens
    description: The behaviour you are seeing, and which entity or panel tab it concerns.
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: What you expected instead
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    description: Also say how often it happens — every time, or now and then?
    value: '1.

      2.

      3.

      '
  validations:
    required: true
- type: dropdown
  id: regression
  attributes:
    label: Did it work before?
    options:
    - It never worked for me
    - It worked and broke after an update
    - Not sure
  validations:
    required: true
- type: input
  id: last_working_version
  attributes:
    label: Last version that worked
    description: Only if it broke after an update.
    placeholder: 3.0.0-beta.7
- type: markdown
  attributes:
    value: '## The battery'
- type: dropdown
  id: device_version
  attributes:
    label: Device version
    description: The one you picked during setup. It selects the register map.
    options:
    - Venus A
    - Venus D
    - Venus E v1/v2
    - Venus E v3
    - Other / not sure
  validations:
    required: true
- type: input
  id: pack_count
  attributes:
    label: Number of battery packs
    description: Venus A and D only — a Venus E has one built-in battery.
    placeholder: '3'
- type: input
  id: firmware
  attributes:
    label: Device firmware
    description: State of the "Firmware Version" sensor, which carries EMS, VMS, MPPT and BMS in one string.
      Add the individual version sensors if you have them enabled.
    placeholder: V147.6.117.112
  validations:
    required: true
- type: markdown
  attributes:
    value: '## Home Assistant'
