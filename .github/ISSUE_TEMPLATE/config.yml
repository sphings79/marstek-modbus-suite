blank_issues_enabled: false
contact_links:
  - name: Question, or help with your setup
    url: https://github.com/sphings79/marstek-modbus-suite/discussions/categories/q-a
    about: Not sure it is a bug? Ask in Discussions — gateways, entities, automations, migration.
  - name: The battery disappears every 30 minutes (v150) or reboots every few hours (v151)
    url: https://github.com/sphings79/marstek-modbus-suite/blob/main/FIRMWARE-DROPOUTS.md
    about: The device's own firmware, not an integration bug. v150 resets its network chip, v151 reboots the controller when it cannot upload to the cloud. Mechanism and how to stop it.
  - name: Timeouts or dropped connections when a Modbus proxy is in the path
    url: https://github.com/sphings79/ha-modbusproxy
    about: >-
      A Venus frames its exception replies wrong, and a stock proxy waits for a byte that never
      arrives. Not an integration bug — this build fixes it while the change is in upstream review.
  - name: Known issues
    url: https://github.com/sphings79/marstek-modbus-suite#known-issues
    about: RS485 control mode against User Work Mode, AI Optimized not reflected, and the rest already documented.
