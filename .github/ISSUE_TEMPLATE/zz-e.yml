name: ZZ E
description: bug form second half
body:
- type: input
  id: integration_version
  attributes:
    label: Integration version
    placeholder: 3.0.0-beta.8
  validations:
    required: true
- type: input
  id: ha_version
  attributes:
    label: Home Assistant version
    placeholder: 2026.9.1
  validations:
    required: true
- type: dropdown
  id: ha_installation
  attributes:
    label: Installation type
    options:
    - Home Assistant OS
    - Home Assistant Supervised
    - Home Assistant Container
    - Home Assistant Core
  validations:
    required: true
- type: markdown
  attributes:
    value: '## The connection'
- type: dropdown
  id: connection
  attributes:
    label: How the battery is connected
    description: The battery's own Modbus TCP is served on its Ethernet port only — over WiFi the battery
      does not answer Modbus at all, so there an RS485 adapter is the only way in.
    options:
    - Battery straight to Ethernet, built-in Modbus TCP (Venus A / D / E v3)
    - RS485 adapter over WiFi (e.g. Elfin EW11)
    - RS485 adapter over Ethernet (e.g. Waveshare, PUSR DR134)
    - Other
  validations:
    required: true
- type: input
  id: adapter
  attributes:
    label: Adapter model and its firmware
    description: RS485 adapters only.
    placeholder: Elfin EW11A, firmware 1.7.22
- type: dropdown
  id: proxy
  attributes:
    label: Is a Modbus proxy or multiplexer in between?
    options:
    - No, Home Assistant talks to the gateway directly
    - true
    - Not sure
  validations:
    required: true
- type: textarea
  id: other_clients
  attributes:
    label: The proxy, and anything else reading this battery
    description: Which proxy (modbus-proxy, evcc, the gateway's own multiplexing), and which other clients
      share the connection — an inverter, an energy manager, a second Home Assistant integration. Most
      gateways serve one TCP client at a time, which is worth ruling out before anything else.
- type: textarea
  id: options
  attributes:
    label: Options you changed
    description: 'Anything moved away from the defaults: wait between messages (80 ms), polling intervals
      (10 s high / 60 s low), discharge floor (12 %), pack count.'
- type: markdown
  attributes:
    value: "## Debug log\n\n1. **Settings → Devices & Services → Marstek Modbus Suite → Enable debug logging**\n\
      2. Reproduce the problem and note when it happened\n3. **Disable debug logging** — Home Assistant\
      \ then offers the log file for download\n\nOr put this in `configuration.yaml`, restart, and take\
      \ the log from\n**Settings → System → Logs → Download full log**:\n\n```yaml\nlogger:\n  default:\
      \ warning\n  logs:\n    custom_components.marstek_modbus: debug\n```\n"
- type: textarea
  id: attachments
  attributes:
    label: Debug log and screenshots
    description: Drag the log file into this field to attach it — without a log, most problems cannot
      be diagnosed. Screenshots of the panel or of an entity's history belong here too.
    placeholder: Drag files in here, or paste a short log excerpt between three backticks.
- type: textarea
  id: anything_else
  attributes:
    label: Anything else
    description: Network setup, what else changed around the time it started, remarks.
